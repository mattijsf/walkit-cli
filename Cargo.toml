[package]
name = "walkit-cli"
description = "Command-line tool for Winamp skins on the walkit engine: renders preview images and thumbnails"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/mattijsf/walkit-cli"
readme = "README.md"
keywords = ["winamp", "skin", "screenshot", "wsz", "wal"]
categories = ["command-line-utilities", "multimedia::images"]
# What goes into the crate: the sources, the fonts the binary embeds (with their licenses),
# the museum parameters, the tests and their two original skins, and the docs.
include = [
    "/src",
    "/fonts",
    "/params/museum.json",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[[bin]]
name = "walkit"
path = "src/main.rs"

[dependencies]
# the engine, with its TrueType letters drawn as Winamp draws them
walkit = { version = "0.10", features = ["truetype"] }
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "gif", "jpeg"] }
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ureq = "3"
md-5 = "0.10"

[profile.release]
opt-level = 3
# a panic in the engine unwinds to the batch, which reports it as that skin's failure
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
